# The htl the Teal gate (`just check-tl`, `just test-tl`, and `htl fmt` in
# `just lint`) runs. mise (https://mise.jdx.dev) reads this file: `mise install`
# puts that release on PATH here, whatever `htl` is elsewhere. CI installs the
# same version by reading it from this line (.github/workflows/teal.yml).
[tools]
"cargo:htl-cli" = "0.12.0"
