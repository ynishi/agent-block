[workspace]
members = [
    "crates/agent-block-types",
    "crates/agent-block-mcp",
    "crates/agent-block-core",
    "crates/agent-block",
    "crates/agent-block-testkit",
]
resolver = "2"

[workspace.package]
version = "0.35.1"
edition = "2021"
authors = ["Yutaka Nishimura"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ynishi/agent-block"
homepage = "https://github.com/ynishi/agent-block"

[workspace.dependencies]
agent-block-types = { path = "crates/agent-block-types", version = "0.35.1" }
# default-features = false so in-workspace consumers (core) control the
# `mcp-http` transport feature explicitly. External consumers still get the
# crate's own default (["mcp-http"]) — this only affects this workspace.
agent-block-mcp   = { path = "crates/agent-block-mcp",   version = "0.35.1", default-features = false }
agent-block-core  = { path = "crates/agent-block-core",  version = "0.35.1" }

thiserror    = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "signal"] }
tokio-util   = { version = "0.7", features = ["rt"] }
reqwest      = { version = "0.12", features = ["json"] }
uuid         = { version = "1", features = ["v4"] }
tracing      = "0.1"
async-trait  = "0.1"
# HTTP-transport features (client-side-sse / transport-streamable-http-client*)
# are NOT declared here so they can be gated behind the agent-block-mcp
# `mcp-http` feature. The base set (stdio child-process transport) is always on.
rmcp         = { version = "3.0.1", features = ["client", "transport-child-process"] }
mlua-isle    = { version = "0.4.1", features = ["pool", "tokio"] }
mlua         = { version = "0.11", features = ["lua54", "vendored", "async", "serialize"] }
# `sql` / `kv` features are NOT declared here so they can be gated behind the
# agent-block-core `sqlite` feature (they pull in rusqlite/bundled).
mlua-batteries = { version = "0.3", features = ["json", "fs", "env", "path", "time", "task"] }
rusqlite     = { version = "0.31", features = ["bundled"] }
anyhow       = "1"
dotenvy      = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap         = { version = "4", features = ["derive", "env"] }
rustls       = { version = "0.23", default-features = false, features = ["ring"] }
agent-mesh-core = "0.3"
agent-mesh-sdk  = "0.3"
llm-extract     = "0.1"
# Sandbox (Linux-only, pulled in under a `cfg(target_os = "linux")` target
# table in agent-block-core): Landlock for the filesystem/TCP boundary,
# seccompiler for the io_uring deny, libc for syscall numbers + errno.
landlock        = "0.4.7"
seccompiler     = "0.5.0"
libc            = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
