[workspace]
members = [
    "crates/agent-block-types",
    "crates/agent-block-mcp",
    "crates/agent-block-core",
    "crates/agent-block",
    "crates/agent-block-testkit",
]
# `lua-spec-runner` is deliberately out of the workspace: it depends on
# mlua-lspec, which pulls mlua with `send`, and feature unification would then
# turn `send` on for mlua-batteries — which does not compile with it. Run it
# via `just test-lua`. Rationale in full: crates/lua-spec-runner/src/main.rs.
exclude = ["crates/lua-spec-runner"]
resolver = "2"

[workspace.package]
version = "0.38.0"
edition = "2021"
authors = ["Yutaka Nishimura"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ynishi/agent-block"
homepage = "https://github.com/ynishi/agent-block"

[workspace.dependencies]
agent-block-types = { path = "crates/agent-block-types", version = "0.38.0" }
# default-features = false so in-workspace consumers (core) control the
# `mcp-http` transport feature explicitly. External consumers still get the
# crate's own default (["mcp-http"]) — this only affects this workspace.
agent-block-mcp   = { path = "crates/agent-block-mcp",   version = "0.38.0", default-features = false }
agent-block-core  = { path = "crates/agent-block-core",  version = "0.38.0" }

thiserror    = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "signal"] }
tokio-util   = { version = "0.7", features = ["rt"] }
reqwest      = { version = "0.12", features = ["json"] }
uuid         = { version = "1", features = ["v4", "v7"] }
tracing      = "0.1"
async-trait  = "0.1"
# HTTP-transport features (client-side-sse / transport-streamable-http-client*)
# are NOT declared here so they can be gated behind the agent-block-mcp
# `mcp-http` feature. The base set (stdio child-process transport) is always on.
rmcp         = { version = "3.0.1", features = ["client", "transport-child-process"] }
mlua-isle    = { version = "0.6.0", features = ["pool", "tokio"] }
mlua         = { version = "0.12", features = ["lua54", "vendored", "async", "serialize"] }
# `std.sql` / `std.kv` no longer live here: as of 0.5 they are their own crate
# (`mlua-batteries-sqlite`, below), so this dependency carries no SQLite weight
# at all and needs no feature gating. 0.5.1 adds `async_overrides`, the opt-in
# layer that replaces the blocking `std.time.sleep` / `std.proc.pipeline` /
# `std.http.*` / `std.fs.*` entries with async ones so a script cannot park the
# VM thread; the host installs it right after `register_all` (see `host.rs`).
# It lives behind the `task` feature, which is in the list below.
mlua-batteries = { version = "0.6.0", features = ["json", "fs", "env", "path", "time", "task"] }
# The `std.sql` / `std.kv` batteries, split out of mlua-batteries at 0.5. Kept
# out of the workspace-wide default set and pulled in only under the
# agent-block-core `sqlite` feature, which is what that feature has always
# gated: the Lua-facing SQL surface, not SQLite itself.
#
# 0.6 puts those two back on a host-owned `rusqlite::Connection` shared through
# `Arc<Mutex<_>>`, with every statement in `tokio::task::spawn_blocking` and an
# `InterruptHandle` for cancellation — so the VM thread still never waits on
# SQLite, and registration is synchronous again (no `block_on` to drive an
# async `kv::register`).
#
# 0.8 is the rusqlite 0.40 track (API unchanged); it moves with `rusqlite` /
# `rusqlite-isle` / `eventsdb-sqlite` below, because `libsqlite3-sys` declares
# `links = "sqlite3"` and a graph holds exactly one of it.
mlua-batteries-sqlite = "0.8"
# Composable `require` resolution (Registry / FsResolver / MemoryResolver).
# Owns module lookup for blocks/ so embedded sources and filesystem overrides
# share one priority chain instead of two parallel mechanisms.
mlua-pkg     = "0.9"
# The SQLite cluster, one line for everything that links it. `libsqlite3-sys`
# declares `links = "sqlite3"`, so the graph holds exactly one major of it
# however the `sqlite` feature is set: rusqlite 0.40 → libsqlite3-sys 0.38
# (SQLite 3.53.2, past the WAL-reset corruption bug present through 3.51.2),
# with `rusqlite-isle` 0.6, `mlua-batteries-sqlite` 0.8 and `eventsdb-sqlite`
# 0.6 all on that track. Moving any one of them means moving all four.
#
# `rusqlite-isle` is what `std.ts` talks to — the connection lives on its own
# thread — and plain `rusqlite` is here for the types (`Connection`, `Error`,
# `OpenFlags`, …) that appear in the closures handed to it, and for the
# `Connection` / `InterruptHandle` the host opens for `std.sql` / `std.kv` and
# passes to the batteries.
rusqlite      = { version = "0.40", features = ["bundled"] }
rusqlite-isle = { version = "0.6", features = ["tokio"] }
# The kernel's event log. `eventsdb-core` is the contract (envelope, schema
# versioning, the store SPI, upcasters) and `eventsdb-sqlite` the durable
# backend: one file, one writer thread, WAL, a global position, and the
# transaction hatch the kernel's two-stream writes and SQL reads go through.
#
# 0.5 is strict where it used to substitute: a query cell with no JSON value —
# a BLOB, a non-finite REAL, TEXT that is not UTF-8 — is refused with the
# column named instead of coming back as a marker string or a null. It also
# waits `busy_timeout` when it opens a file another connection is holding,
# where it used to fail at once, and it refuses at open a file that already
# holds an `events` table it did not create (which is why the legacy migration
# renames one before the open — see `knl::logs`).
#
# 0.6 is additive throughout — nothing in it breaks a caller — and two of its
# additions are what `agent-block knl backup` and `agent-block knl sessions`
# are made of: `backup_to` takes a consistent physical copy of a log that is
# open and being written to (`cp` of a WAL database with a writer open can
# carry half a transaction), and `streams` lists a store's streams off the
# `stream_seq` counter, which is the only way to learn a session id from
# outside the host process.
#
# `tracing` is on because it is `dep:tracing` and nothing else: the spans are
# at `debug` and the events at `trace`/`warn`, and this binary's subscriber
# defaults to `info` (`crates/agent-block/src/main.rs`), so at the default
# level it costs nothing. What it buys is a view of the store that a caller
# cannot wrap from outside — how long the write lock was held, which batch a
# projection took, whether a subscription woke on the commit channel or on the
# poll — and reading it takes both halves, because most of those paths are a
# span with no event inside it and a span is not a line:
#
#     AGENT_BLOCK_LOG_SPANS=1 RUST_LOG=eventsdb_sqlite=debug agent-block …
#
# The filter names the crate (`eventsdb_sqlite`); `eventsdb` is the facade and
# nothing here goes through it.
eventsdb-core   = "0.6"
eventsdb-sqlite = { version = "0.6", features = ["tracing"] }
# The syscall surface's single source of truth. `schema-bridge` derives the
# `Schema` IR off the Rust argument / return types of `bridge/knl.rs` and
# `schema-bridge-lshape` renders that IR as an lshape Lua module. Not
# optional: the kernel is in every build, and a surface whose declaration is
# generated only sometimes is a surface that drifts.
#
# The third crate of that family, `mlua-lshape` (which vendors the lshape 0.3
# runtime the generated module loads under), is deliberately NOT here. It
# pins `mlua` with the `send` feature, and feature unification would turn
# `send` on for `mlua-batteries`, which does not compile with it — the same
# reason `lua-spec-runner` is excluded from the workspace above. The lshape
# 0.3.0 Lua sources are vendored under `crates/agent-block-core/blocks/lib/
# lshape/` instead, copied verbatim from that crate's `lua/lshape/`.
schema-bridge        = "0.4"
schema-bridge-lshape = "0.2"
# What makes a serde refusal readable as a syscall refusal. serde reports a
# type mismatch without saying which field it was reading, and
# `budget.tag: invalid type: number, expected a string` is the whole
# difference between a message a caller can act on and one they cannot. It
# wraps the deserializer and records the path it was at when it failed.
serde_path_to_error = "0.1"
anyhow       = "1"
# Content fingerprint for `std.fs.read_versioned` / `edit`'s optimistic
# concurrency check. Already in the tree transitively.
sha2         = "0.10"
dotenvy      = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap         = { version = "4", features = ["derive", "env"] }
rustls       = { version = "0.23", default-features = false, features = ["ring"] }
agent-mesh-core = "0.3"
agent-mesh-sdk  = "0.3"
llm-extract     = "0.1"
# Sandbox (Linux-only, pulled in under a `cfg(target_os = "linux")` target
# table in agent-block-core): Landlock for the filesystem/TCP boundary,
# seccompiler for the io_uring deny, libc for syscall numbers + errno.
landlock        = "0.4.7"
seccompiler     = "0.5.0"
libc            = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
