[package]
name = "agent-block-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "rmcp client wrapper for agent-block (MCP server lifecycle + custom handler)"

[features]
# Default keeps the HTTP transport surface on, preserving existing behavior for
# any crate that depends on agent-block-mcp with default features.
default = ["mcp-http"]
# `mcp-http` enables the Streamable HTTP / SSE MCP transports (McpManager::connect_http).
# When off, only the stdio child-process transport is compiled and connect_http
# is absent. rmcp's HTTP-client transport features are pulled in here so they
# are excluded from the binary when a downstream crate opts out.
mcp-http = [
    "rmcp/client-side-sse",
    "rmcp/transport-streamable-http-client",
    "rmcp/transport-streamable-http-client-reqwest",
    # TLS for https:// MCP endpoints. `reqwest-tls-no-provider` = rustls +
    # rustls-platform-verifier (OS trust store) WITHOUT bundling a crypto
    # provider. Chosen over `rmcp/reqwest` (rustls + aws-lc-rs) to avoid a
    # second provider conflicting with the ring provider already used for WSS.
    # reqwest panics at Client build unless a process-level provider is
    # installed, so `connect_http` installs ring idempotently (see http.rs) —
    # hence the direct rustls dep below.
    "rmcp/reqwest-tls-no-provider",
    "dep:rustls",
]

[dependencies]
agent-block-types.workspace = true

rmcp.workspace = true
rustls = { workspace = true, optional = true }
mlua.workspace = true
mlua-isle.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true

[dev-dependencies]
# rmcp `server` (+ `transport-async-rw`) for in-process concurrency tests that
# run an MCP server over tokio::io::duplex pipes; `elicitation` for the elicit
# round-trip tests in lib.rs.
rmcp = { version = "3.0.1", features = ["server", "transport-streamable-http-server", "elicitation"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7" }
