[package]
name = "agent-block-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host runtime + Lua stdlib bridge + EventBus for agent-block"

[features]
# Default enables the full runtime surface, preserving existing behavior for
# every embedder that depends on agent-block-core with default features.
default = ["mesh", "sqlite", "mcp-http"]
# `mesh` — agent-to-agent mesh (`mesh.*` Lua bridge, relay connect, Ed25519
# identity). Pulls in agent-mesh-core / agent-mesh-sdk.
mesh = ["dep:agent-mesh-core", "dep:agent-mesh-sdk"]
# `sqlite` — SQLite-backed `sql.*` / `kv.*` / `ts.*` Lua bridges. Pulls in the
# `mlua-batteries-sqlite` batteries (`std.sql` / `std.kv`), which since 0.5 are
# a crate of their own rather than features of `mlua-batteries`. Since that
# crate's 0.6 the host opens their `rusqlite::Connection`s itself and hands
# each over as `Arc<Mutex<_>>` plus an `InterruptHandle`; the statements run
# in `tokio::task::spawn_blocking`, so the VM thread still never waits on
# SQLite. `std.ts` and the kernel store keep their own connection threads
# (`rusqlite-isle`), which is the other way of honouring the same rule.
#
# It does not gate rusqlite: the kernel (`knl`) keeps every session's event log
# in a SQLite table — a file for a durable session, an in-memory database for
# an ephemeral one — because the log is read with SQL (`session:query`), and a
# build where that was optional would be a build with a second, lesser kind of
# session. So rusqlite / rusqlite-isle are ordinary dependencies below, and
# this feature is what it always was for the *batteries*: the `sql.*` /
# `kv.*` / `ts.*` Lua surface.
sqlite = ["dep:mlua-batteries-sqlite"]
# `mcp-http` — Streamable HTTP / SSE MCP transport (`mcp.connect_http`).
# Forwards to agent-block-mcp's `mcp-http` feature (stdio transport is always on).
mcp-http = ["agent-block-mcp/mcp-http"]

[dependencies]
agent-block-types.workspace = true
# agent-block-mcp is inherited with default-features = false (set at the
# workspace level), so the core `mcp-http` feature is the sole switch for the
# HTTP transport; without it agent-block-mcp compiles stdio-only.
agent-block-mcp.workspace = true

mlua.workspace = true
mlua-isle.workspace = true
mlua-batteries.workspace = true
# The `std.sql` / `std.kv` batteries, behind the `sqlite` feature. Both
# registrations are synchronous (0.6), so nothing here has to drive a future
# from the Isle's sync init closure.
mlua-batteries-sqlite = { workspace = true, optional = true }
mlua-pkg.workspace = true
# The knl syscall surface, declared once. The Rust argument / return types in
# `bridge/knl.rs` derive `SchemaBridge` and `schema-bridge-lshape` turns that
# IR into the `knl_types` Lua module the host embeds at start. Both are
# unconditional for the same reason `rusqlite` is: the kernel is in every
# build. The lshape runtime the generated module loads under is the vendored
# copy in `blocks/lib/lshape/` rather than the `mlua-lshape` crate — see the
# workspace manifest for why.
schema-bridge.workspace = true
schema-bridge-lshape.workspace = true
serde_path_to_error.workspace = true
agent-mesh-core = { workspace = true, optional = true }
agent-mesh-sdk = { workspace = true, optional = true }
llm-extract.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# Not optional: the kernel's event log is a SQLite database in every build
# (see the `sqlite` feature note above). `eventsdb-sqlite` owns that database
# — one writer thread per file, the transaction hatch the kernel's two-stream
# writes go through, and the read-only connections its SQL views run on — and
# `eventsdb-core` is the contract the kernel's SPI is written against.
# `rusqlite-isle` owns the `std.ts` connection thread, and `rusqlite` supplies
# the types those closures are written in, plus the `Connection` /
# `InterruptHandle` the host opens for `std.sql` / `std.kv` and hands to the
# batteries. All of them come from one cluster (see the workspace manifest),
# so there is one libsqlite3-sys in the graph.
eventsdb-core = { workspace = true }
eventsdb-sqlite = { workspace = true }
rusqlite = { workspace = true }
rusqlite-isle = { workspace = true }
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-trait.workspace = true
dotenvy.workspace = true
uuid.workspace = true
thiserror.workspace = true
# The HTTP bus source (`bus::http_source`): one listener that turns a request
# into an event and the handler's answer into the response. `json` is for the
# reply body; the client side of HTTP stays on `reqwest` above.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }

# Sandbox backend (`crate::sandbox`). Linux-only: Landlock and seccomp have no
# equivalent elsewhere, and `sandbox::apply` returns an explicit "Linux-only"
# error on other targets rather than silently doing nothing.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

# `killpg` for `sh.exec`'s timeout, which is a POSIX call and not a Linux one —
# the binaries built for macOS need it as much as the Linux ones do. It is
# listed here rather than only above so the sandbox's Linux-only-ness does not
# decide it.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7" }
tempfile = "3"
# `mlua` / `mlua-pkg` were dev-dependencies for `tests/tool_loop_session.rs`,
# which built a VM by hand instead of starting the host. That test covered
# tool_loop's kernel-session path, which is retired (the loop over a
# recorded session is `knl.beat`, see the knl module doc), and both crates
# are ordinary dependencies above, so the duplicates went with it.

# SIGTERM / SIGINT delivery for EventBus dispatcher unit tests.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
